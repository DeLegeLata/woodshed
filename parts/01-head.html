<title>Woodshed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --tolex:#15110e;
  --panel:#221b16;
  --panel-2:#2b231b;
  --panel-3:#352b21;
  --edge:#40352a;
  --edge-hi:#5b4c3c;
  --cream:#ece0c8;
  --cream-2:#a3967f;
  --cream-3:#6e6355;
  --amber:#ff9d2f;
  --amber-2:#c4741a;
  --oxblood:#8a2f26;
  --brass:#c9a227;
  --go:#7fb489;
  --warn:#e0a13a;
  --bad:#cd5f4d;
  --f-legend:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Karla",system-ui,-apple-system,sans-serif;
  --f-mono:"Space Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--tolex);
  color:var(--cream);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.014) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.22) 0 2px, transparent 2px 4px),
    radial-gradient(120% 80% at 50% 0%, #221a14 0%, #15110e 70%);
}

.app{max-width:540px;margin:0 auto;padding:14px 14px 44px;display:flex;flex-direction:column;gap:14px}

.plate{
  background:linear-gradient(180deg,var(--panel-2) 0%,var(--panel) 62%,#1c1611 100%);
  border:1px solid var(--edge);
  border-radius:var(--r);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 26px rgba(0,0,0,.5);
  position:relative;
}
.plate::after{
  content:"";position:absolute;left:10px;right:10px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(236,224,200,.24),transparent);
}
.plate-pad{padding:16px}

.legend{
  font-family:var(--f-legend);font-weight:600;text-transform:uppercase;
  letter-spacing:.18em;font-size:12px;color:var(--cream-2);
}
.legend-amber{color:var(--amber-2)}
h1,h2,h3{font-family:var(--f-legend);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.02em}
h1{font-size:26px;text-transform:uppercase;letter-spacing:.14em}
h2{font-size:21px}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.1em;color:var(--cream-2)}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}
.prose{max-width:62ch;color:#d6c9b1}
.prose em{color:var(--amber);font-style:normal;font-weight:700}
.dim{color:var(--cream-2)}
.tiny{font-size:12.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:8px}

.head{display:flex;align-items:center;gap:12px;padding:2px 4px}
.lamp{
  width:16px;height:16px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 30%,#5c3a18,#2a1a0c 70%);
  border:2px solid #6a5844;
  box-shadow:0 0 0 1px #120e0a;
  transition:background .09s linear,box-shadow .09s linear;
}
.lamp.on{
  background:radial-gradient(circle at 34% 30%,#ffe6b0,var(--amber) 45%,#a5490b 100%);
  box-shadow:0 0 14px 3px rgba(255,157,47,.55),0 0 0 1px #120e0a;
}
.lamp.on.accent{
  background:radial-gradient(circle at 34% 30%,#ffd9d2,#e8503a 45%,#7a1e12 100%);
  box-shadow:0 0 16px 4px rgba(232,80,58,.6),0 0 0 1px #120e0a;
}
.brand{font-family:var(--f-legend);text-transform:uppercase;letter-spacing:.26em;font-size:14px;font-weight:700;color:var(--cream)}
.head .spacer{flex:1}
.streak-chip{
  font-family:var(--f-legend);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--amber);border:1px solid var(--edge-hi);border-radius:999px;padding:3px 10px;
  background:rgba(255,157,47,.07);
}

.btn{
  font-family:var(--f-legend);text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:15px;
  padding:14px 18px;border-radius:8px;border:1px solid var(--edge-hi);
  background:linear-gradient(180deg,var(--panel-3),#241c15);
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 3px 0 #120d09,0 6px 14px rgba(0,0,0,.45);
  color:var(--cream);transition:transform .05s,box-shadow .05s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;
}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 1px 0 #120d09}
.btn.primary{
  background:linear-gradient(180deg,#ffb14e,var(--amber) 55%,#d1750f);
  color:#2a1704;border-color:#ffcb84;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 0 #7b3f06,0 8px 20px rgba(255,157,47,.28);
}
.btn.primary:active{box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 1px 0 #7b3f06}
.btn.wide{width:100%}
.btn.quiet{background:none;box-shadow:none;border-color:var(--edge);color:var(--cream-2);min-height:42px;padding:10px 14px;font-size:13px}
.btn.quiet:active{transform:none;background:rgba(255,255,255,.04)}
.btn.danger{border-color:#6b2b23;color:#e09a8d}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:10px}
.row.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.dial{display:flex;align-items:center;justify-content:center;gap:18px}
.knob{
  width:78px;height:78px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 38% 28%,#4a3c2f,#241c15 62%,#161009 100%);
  border:1px solid #5b4b3a;
  box-shadow:0 1px 0 rgba(255,255,255,.13) inset,0 6px 0 #100c08,0 10px 22px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-legend);font-size:40px;line-height:1;color:var(--cream);
  transition:transform .06s,box-shadow .06s;
}
.knob:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 2px 0 #100c08}
.knob[disabled]{opacity:.3;pointer-events:none}
.readout{text-align:center;min-width:132px}
.readout .num{
  font-family:var(--f-legend);font-weight:700;font-size:80px;line-height:.86;
  color:var(--cream);font-variant-numeric:tabular-nums;
  text-shadow:0 0 26px rgba(255,157,47,.22);
}
.readout .unit{font-family:var(--f-legend);text-transform:uppercase;letter-spacing:.3em;font-size:12px;color:var(--amber-2);margin-top:8px}

.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(236,224,200,.13)}
.kv:last-child{border-bottom:none}
.kv .k{font-family:var(--f-legend);text-transform:uppercase;letter-spacing:.13em;font-size:12px;color:var(--cream-3)}
.kv .v{font-family:var(--f-mono);font-size:14px;color:var(--cream)}

.blocklist{display:flex;flex-direction:column;gap:8px}
.blockrow{
  display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;
  padding:12px 14px;border:1px solid var(--edge);border-radius:8px;background:rgba(0,0,0,.2);
}
.blockrow .mins{font-family:var(--f-legend);font-size:22px;color:var(--amber);text-align:right;font-variant-numeric:tabular-nums}
.blockrow .t{font-family:var(--f-legend);text-transform:uppercase;letter-spacing:.1em;font-size:14px}
.blockrow .s{font-size:12.5px;color:var(--cream-2);line-height:1.35}
.blockrow.done{opacity:.42}
.blockrow.active{border-color:var(--amber-2);background:rgba(255,157,47,.08)}
.chip{
  font-family:var(--f-legend);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;border:1px solid var(--edge-hi);color:var(--cream-2);white-space:nowrap;
}
.chip.go{color:var(--go);border-color:#3f6a48}
.chip.amber{color:var(--amber);border-color:#7a5320}

.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hud .clock{font-family:var(--f-legend);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--cream)}
.hud .clock.low{color:var(--warn)}
.hud .bpm{font-family:var(--f-mono);font-size:13px;color:var(--cream-2)}
.progressbar{height:4px;border-radius:2px;background:rgba(0,0,0,.45);overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.progressbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--amber-2),var(--amber));transition:width .3s linear}

.fretwrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:8px}
.fretwrap svg{display:block;min-width:520px;width:100%;height:auto}
.rotate-hint{
  display:none;align-items:center;gap:10px;padding:10px 12px;margin-top:10px;
  border:1px dashed var(--edge-hi);border-radius:8px;color:var(--cream-2);font-size:13px;
}
@media (orientation:portrait){ .rotate-hint.show{display:flex} }

.seg{display:flex;border:1px solid var(--edge-hi);border-radius:8px;overflow:hidden}
.seg button{
  flex:1;padding:10px 6px;font-family:var(--f-legend);text-transform:uppercase;letter-spacing:.1em;
  font-size:12.5px;color:var(--cream-2);background:rgba(0,0,0,.2);min-height:44px;
  border-right:1px solid var(--edge);
}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#ffb14e,var(--amber));color:#2a1704;font-weight:700}
input[type=range]{width:100%;accent-color:var(--amber);height:32px}
input[type=text],input[type=number],input[type=time],select,textarea{
  width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--edge-hi);
  background:rgba(0,0,0,.3);color:var(--cream);font-family:var(--f-body);font-size:15px;
}
textarea{min-height:76px;resize:vertical}
label.field{display:block;margin-bottom:12px}
label.field > span{display:block;margin-bottom:6px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed rgba(236,224,200,.13)}
.switch:last-child{border-bottom:none}
.toggle{width:52px;height:30px;border-radius:999px;border:1px solid var(--edge-hi);background:rgba(0,0,0,.4);position:relative;flex:none}
.toggle i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--cream-3);transition:left .14s,background .14s}
.toggle[aria-pressed="true"]{background:rgba(255,157,47,.24);border-color:var(--amber-2)}
.toggle[aria-pressed="true"] i{left:24px;background:var(--amber)}

.tuner-meter{position:relative;height:74px;border:1px solid var(--edge);border-radius:8px;background:rgba(0,0,0,.3);overflow:hidden}
.tuner-meter .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 6px;align-items:flex-end}
.tuner-meter .ticks i{width:1px;height:12px;background:rgba(236,224,200,.2)}
.tuner-meter .ticks i.mid{height:26px;background:var(--amber-2)}
.tuner-meter .needle{position:absolute;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--amber);left:50%;transform:translateX(-50%);transition:left .09s linear,background .09s}
.tuner-meter .needle.ok{background:var(--go);box-shadow:0 0 14px rgba(127,180,137,.7)}
.tuner-note{font-family:var(--f-legend);font-size:64px;line-height:1;text-align:center}
.tuner-cents{text-align:center;font-family:var(--f-mono);font-size:13px;color:var(--cream-2)}
.stringdots{display:flex;justify-content:space-between;gap:6px;margin-top:12px}
.stringdots div{
  flex:1;text-align:center;padding:8px 0;border:1px solid var(--edge);border-radius:6px;
  font-family:var(--f-legend);font-size:16px;color:var(--cream-3);
}
.stringdots div.hit{border-color:var(--go);color:var(--go);background:rgba(127,180,137,.1)}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px;border:1px solid var(--edge);border-radius:8px;background:rgba(0,0,0,.2);text-align:center}
.stat .n{font-family:var(--f-legend);font-size:30px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--f-legend);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-3);margin-top:5px}
.weekdots{display:flex;gap:6px;justify-content:space-between}
.weekdots > div{flex:1;text-align:center}
.weekdots b{
  display:block;height:30px;border-radius:6px;border:1px solid var(--edge);background:rgba(0,0,0,.25);
  margin-bottom:4px;
}
.weekdots b.on{background:linear-gradient(180deg,#ffb14e,var(--amber));border-color:#ffcb84}
.weekdots b.rest{background:rgba(255,157,47,.13);border-color:var(--amber-2)}
.weekdots span{font-family:var(--f-legend);font-size:10px;letter-spacing:.1em;color:var(--cream-3)}

.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button{padding:16px 8px;border:1px solid var(--edge-hi);border-radius:8px;background:rgba(0,0,0,.22);text-align:center}
.rate button .e{font-size:22px;display:block;margin-bottom:4px}
.rate button .t{font-family:var(--f-legend);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-2)}

.songrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed rgba(236,224,200,.13)}
.songrow:last-child{border-bottom:none}
.songrow .nm{flex:1;min-width:0}
.songrow .nm b{display:block;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songrow .nm span{font-size:12px;color:var(--cream-3);font-family:var(--f-mono)}
.reclist{display:flex;flex-direction:column;gap:10px}
.reclist audio{width:100%;height:36px}

.quizopts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.quizopts button{
  padding:14px;border:1px solid var(--edge-hi);border-radius:8px;text-align:left;
  background:rgba(0,0,0,.22);font-size:15px;min-height:50px;
}
.quizopts button.right{border-color:var(--go);background:rgba(127,180,137,.14)}
.quizopts button.wrong{border-color:var(--bad);background:rgba(205,95,77,.14)}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
  background:#2c231b;border:1px solid var(--edge-hi);border-radius:8px;padding:11px 16px;
  font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);max-width:88vw;text-align:center;
}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.note{border-left:2px solid var(--amber-2);padding:2px 0 2px 12px;color:var(--cream-2);font-size:13.5px}
/* ---------- live chord readout ---------- */
.chordcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.chordnow{font-family:var(--f-legend);font-weight:700;font-size:46px;line-height:.9;color:var(--amber);min-width:2.6ch;white-space:nowrap}
.tones{display:flex;gap:6px;flex-wrap:wrap}
.tone{display:flex;flex-direction:column;align-items:center;min-width:36px;padding:4px 6px;border:1px solid #3f6a48;border-radius:6px;background:rgba(127,180,137,.08)}
.tone b{font-family:var(--f-legend);font-size:18px;font-weight:600;color:var(--cream);line-height:1.1}
.tone span{font-family:var(--f-mono);font-size:10px;color:var(--go)}
.tone.root{border-color:var(--amber-2);background:rgba(255,157,47,.12)}
.tone.root span{color:var(--amber)}
.nextchord{text-align:right}
.nextchord b{display:block;font-family:var(--f-legend);font-size:24px;font-weight:600;color:var(--cream-2);line-height:1.1;white-space:nowrap}
.barpips{display:flex;gap:4px}
.barpips i{flex:1;height:5px;border-radius:2px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06)}
.barpips i.on{background:var(--amber);border-color:#ffcb84}
@media (max-width:420px){ .chordcard{grid-template-columns:auto 1fr} .nextchord{grid-column:1 / -1;text-align:left;display:flex;gap:8px;align-items:baseline} .nextchord b{display:inline} }

/* ---------- step lists and theory ---------- */
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:7px;color:#d6c9b1;max-width:62ch}
.steps li::marker{font-family:var(--f-legend);font-weight:600;color:var(--amber-2)}
.theory{display:flex;flex-direction:column;gap:4px}
.theory h3{margin:14px 0 4px;font-size:13px;color:var(--amber-2)}
.theory h3:first-child{margin-top:0}
.theory p{color:#d6c9b1;max-width:62ch}
.theory b{color:var(--cream);font-weight:700}
.cmpwrap{overflow-x:auto;margin:6px 0 4px}
.cmp{display:grid;grid-template-columns:max-content repeat(7,minmax(34px,1fr));gap:4px;min-width:340px}
.cmp .lab{font-family:var(--f-legend);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream-3);align-self:center;padding-right:8px;white-space:nowrap}
.cmp span{font-family:var(--f-legend);font-size:15px;text-align:center;padding:5px 0;border-radius:5px;background:rgba(0,0,0,.28);color:var(--cream-2)}
.cmp span.home{color:var(--cream);font-weight:700}
.cmp span.diff{background:rgba(255,157,47,.2);color:var(--amber);font-weight:700;box-shadow:inset 0 0 0 1px var(--amber-2)}
.cmp .deg{background:none;font-family:var(--f-mono);font-size:10px;color:var(--cream-3);padding:0}
details.more{border:1px solid var(--edge);border-radius:8px;padding:10px 12px;background:rgba(0,0,0,.18)}
details.more summary{cursor:pointer;font-family:var(--f-legend);text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--cream-2);list-style:none;min-height:28px;display:flex;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";color:var(--amber);margin-right:10px;font-size:18px;width:12px}
details.more[open] summary::before{content:"\2212"}
details.more[open] summary{margin-bottom:10px}
.songgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.songgrid .full{grid-column:1 / -1}
.songgrid label{display:block}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.chartline{font-family:var(--f-legend);font-size:18px;letter-spacing:.04em;color:var(--cream);overflow-x:auto;white-space:nowrap;padding:6px 0}
.chartline span{padding:2px 6px;border-radius:4px}
.chartline span.now{background:rgba(255,157,47,.2);color:var(--amber)}
.chartline i{font-style:normal;color:var(--cream-3);padding:0 2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
